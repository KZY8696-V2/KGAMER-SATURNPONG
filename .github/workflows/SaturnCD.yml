name: SaturnCD-Packager

on:
  workflow_run:
    workflows: ["SaturnCD"]
    types:
      - completed

jobs:
  package-cd:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Download Artifacts from Main Workflow
      uses: actions/download-artifact@v4
      with:
        run_id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Download Jo Engine v2026.3 (For Native CueMaker Tool)
      run: |
        wget -O jo_engine.zip https://github.com/johannes-fetz/joengine/archive/refs/tags/v2026.3.zip
        unzip -q jo_engine.zip
        mv joengine-2026.3 jo_engine_src
        chmod -R +x jo_engine_src/Compiler/LINUX/ || true

    - name: Run Jo Engine Native CueMaker & Package CD
      run: |
        mkdir -p saturn_cd_staging
        
        # İlk workflow'dan gelen tüm dosyaları çalışma alanına alıyoruz
        find . -maxdepth 4 -type f \( -name "*.bin" -o -name "*.elf" -o -name "*.o" -o -name "*.BIN" \) -not -path "*/jo_engine_src/*" -exec cp {} saturn_cd_staging/ \;
        
        cd saturn_cd_staging
        ls -la
        
        # Dosya adını Jo Engine standardına (0.bin) hizalıyoruz
        if [ -f "saturnpong.elf" ] && [ ! -f "0.bin" ]; then
          cp saturnpong.elf 0.bin
        elif [ -f "saturnpong.o" ] && [ ! -f "0.bin" ]; then
          cp saturnpong.o 0.bin
        elif [ -f "saturnpong.bin" ] && [ ! -f "0.bin" ]; then
          cp saturnpong.bin 0.bin
        fi
        
        # SaturnCD/IP.BIN/IP.BIN klasör yapısından veya artifact içinden IP.BIN dosyasını bulup kopyalıyoruz
        if [ -f "IP.BIN" ]; then
          echo "IP.BIN is already in place."
        elif [ -f "SaturnCD/IP.BIN/IP.BIN" ]; then
          cp SaturnCD/IP.BIN/IP.BIN ./IP.BIN
        elif [ -f "../SaturnCD/IP.BIN/IP.BIN" ]; then
          cp ../SaturnCD/IP.BIN/IP.BIN ./IP.BIN
        else
          # Eğer yukarıdakilerle eşleşmezse Jo Engine kaynaklarındakini alalım
          FOUND_IP=$(find ../jo_engine_src -name "IP.BIN" | head -n 1)
          if [ -n "$FOUND_IP" ]; then
            cp "$FOUND_IP" ./IP.BIN
          else
            dd if=/dev/zero of=IP.BIN bs=1024 count=2 || true
          fi
        fi
        
        # Resmi JoEngineCueMaker aracını çalıştırıyoruz
        CUE_MAKER="../jo_engine_src/Compiler/LINUX/Other Utilities/JoEngineCueMaker"
        if [ -f "$CUE_MAKER" ]; then
          echo "Running official JoEngineCueMaker..."
          "$CUE_MAKER" || true
        else
          find ../jo_engine_src -name "JoEngineCueMaker" -exec chmod +x {} \; -exec {} \; || true
        fi
        
        cd ..

    - name: Archive Final Saturn CD Files
      run: |
        mkdir -p final_cd_bundle
        find saturn_cd_staging -type f \( -name "*.iso" -o -name "*.cue" -o -name "*.bin" -o -name "*.img" -o -name "*.BIN" \) -exec cp {} final_cd_bundle/ \;
        
        ls -la final_cd_bundle/
        zip -r SaturnPong-Official-CD.zip final_cd_bundle/

    - name: Upload Playable Saturn CD Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SaturnPong-Official-CD-Bundle
        path: SaturnPong-Official-CD.zip
