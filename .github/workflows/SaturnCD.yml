name: SaturnCD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install ISO & Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget unzip genisoimage zip

    - name: Setup Jo Engine and Compile via Makefile
      run: |
        # Jo Engine v2026.3 indirip açıyoruz
        wget -O jo_engine.zip https://github.com/johannes-fetz/joengine/archive/refs/tags/v2026.3.zip
        unzip -q jo_engine.zip
        mv joengine-2026.3 jo_engine_src
        chmod -R +x jo_engine_src/Compiler/LINUX/ || true

        if [ -d "jo_engine_src/mars" ]; then
          rm -f jo_engine_src/mars/*.c jo_engine_src/mars/*.cpp jo_engine_src/mars/*.h || true
          cp saturnpong.s jo_engine_src/mars/
          
          # Jo Engine Makefile yapılandırması
          cat << 'EOF' > jo_engine_src/mars/Makefile
        TARGET = saturnpong
        SRCS = saturnpong.s
        JO_ENGINE_SRC = ..
        include $(JO_ENGINE_SRC)/Makefile.cfg
        EOF
          
          # Jo Engine araç zincirini PATH'e ekleyip derlemeyi başlatıyoruz
          TOOLCHAIN_BIN=$(find "$PWD/jo_engine_src/Compiler" -name "sh-elf-gcc" -printf "%h\n" | head -n 1)
          export PATH="$TOOLCHAIN_BIN:$PATH"
          
          cd jo_engine_src/mars
          make clean || true
          make || true
          cd ../..
        fi

    - name: Build Sega Saturn ISO with genisoimage
      run: |
        mkdir -p cd_root final_cd_bundle

        # Jo Engine derlemesinden çıkan saf binary dosyayı (0.bin / saturnpong.bin) buluyoruz
        FOUND_BIN=$(find jo_engine_src -type f \( -name "0.bin" -o -name "0.BIN" -o -name "saturnpong.bin" -o -name "saturnpong.BIN" \) ! -name "IP.BIN" | head -n 1)
        
        if [ -n "$FOUND_BIN" ]; then
          cp "$FOUND_BIN" cd_root/0.BIN
          echo "Bulunan ve kopyalanan binary: $FOUND_BIN -> cd_root/0.BIN"
        else
          echo "HATA: Jo Engine derlemesi sonucunda binary çıktı bulunamadı!"
          exit 1
        fi

        # Repodaki gerçek IP.BIN dosyasını alıyoruz
        if [ -f "SaturnCD/IP.BIN/IP.BIN" ]; then
          cp "SaturnCD/IP.BIN/IP.BIN" IP.BIN
          echo "IP.BIN başarıyla alındı: SaturnCD/IP.BIN/IP.BIN"
        else
          echo "HATA: SaturnCD/IP.BIN/IP.BIN bulunamadı!"
          exit 1
        fi

        # genisoimage ile IP.BIN boot sektörünü ve 0.BIN'i Sega Saturn ISO formatına mühürlüyoruz
        genisoimage \
          -sysid "SEGA SATURN" \
          -volid "SATURNPONG" \
          -volset "SATURNPONG" \
          -publisher "KGAMER" \
          -preparer "KGAMER" \
          -appid "SATURNPONG" \
          -G IP.BIN \
          -full-iso9660-filenames \
          -o final_cd_bundle/SaturnPong.iso \
          cd_root/

        # Emülatörler için MODE1/2048 CUE dosyasını oluşturuyoruz
        cat << 'EOF' > final_cd_bundle/SaturnPong.cue
        FILE "SaturnPong.iso" BINARY
          TRACK 01 MODE1/2048
            INDEX 01 00:00:00
        EOF

        ls -la final_cd_bundle/
        zip -j SaturnPong-Official-CD.zip final_cd_bundle/SaturnPong.iso final_cd_bundle/SaturnPong.cue

    - name: Upload Playable Saturn CD Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SaturnPong-Official-CD-Bundle
        path: SaturnPong-Official-CD.zip
