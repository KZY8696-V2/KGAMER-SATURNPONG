name: SaturnCD

on:
  workflow_run:
    workflows: ["Build SaturnPong (Jo Engine v2026.3 & Artifacts)"]
    types:
      - completed

jobs:
  package-cd:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Download Artifacts from Build Workflow
      uses: actions/download-artifact@v4
      with:
        run_id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Download Jo Engine v2026.3 (For Native CueMaker Tool)
      run: |
        wget -O jo_engine.zip https://github.com/johannes-fetz/joengine/archive/refs/tags/v2026.3.zip
        unzip -q jo_engine.zip
        mv joengine-2026.3 jo_engine_src
        chmod -R +x jo_engine_src/Compiler/LINUX/ || true

    - name: Run Jo Engine Native CueMaker (No Compilation)
      run: |
        mkdir -p saturn_cd_staging
        
        # İlk workflow'dan gelen ham binary/elf/o dosyalarını çalışma alanına taşıyoruz
        find . -maxdepth 3 -type f \( -name "*.bin" -o -name "*.elf" -o -name "*.o" \) -not -path "*/jo_engine_src/*" -exec cp {} saturn_cd_staging/ \;
        
        cd saturn_cd_staging
        ls -la
        
        # Jo Engine'in beklediği 0.bin isimlendirme standardına hizalıyoruz
        if [ -f "saturnpong.elf" ] && [ ! -f "0.bin" ]; then
          cp saturnpong.elf 0.bin
        elif [ -f "saturnpong.o" ] && [ ! -f "0.bin" ]; then
          cp saturnpong.o 0.bin
        elif [ -f "saturnpong.bin" ] && [ ! -f "0.bin" ]; then
          cp saturnpong.bin 0.bin
        fi
        
        # Boot sektörü için IP.BIN kopyalıyoruz
        if [ ! -f "IP.BIN" ]; then
          cp ../jo_engine_src/IP.BIN ./ || true
        fi
        
        # Resmi JoEngineCueMaker aracını çalıştırarak CUE ve ISO dosyalarını üretiyoruz
        CUE_MAKER="../jo_engine_src/Compiler/LINUX/Other Utilities/JoEngineCueMaker"
        if [ -f "$CUE_MAKER" ]; then
          echo "Running official JoEngineCueMaker..."
          "$CUE_MAKER" || true
        else
          find ../jo_engine_src -name "JoEngineCueMaker" -exec chmod +x {} \; -exec {} \; || true
        fi
        
        cd ..

    - name: Archive Final Saturn CD Files
      run: |
        mkdir -p final_cd_bundle
        find saturn_cd_staging -type f \( -name "*.iso" -o -name "*.cue" -o -name "*.bin" -o -name "*.img" \) -exec cp {} final_cd_bundle/ \;
        
        ls -la final_cd_bundle/
        zip -r SaturnPong-Official-CD.zip final_cd_bundle/

    - name: Upload Playable Saturn CD Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SaturnPong-Official-CD-Bundle
        path: SaturnPong-Official-CD.zip
