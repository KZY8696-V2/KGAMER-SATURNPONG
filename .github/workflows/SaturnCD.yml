name: SaturnCD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build & ISO Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget unzip genisoimage zip

    - name: Download Jo Engine v2026.3
      run: |
        wget -O jo_engine.zip https://github.com/johannes-fetz/joengine/archive/refs/tags/v2026.3.zip
        unzip -q jo_engine.zip
        mv joengine-2026.3 jo_engine_src
        chmod -R +x jo_engine_src/Compiler/LINUX/ || true

    - name: Compile SH-2 Assembly to Raw 0.BIN
      run: |
        # Jo Engine içindeki sh-elf araç zincirini PATH'e ekle
        TOOLCHAIN_BIN=$(find "$PWD/jo_engine_src/Compiler" -name "sh-elf-gcc" -printf "%h\n" | head -n 1)
        export PATH="$TOOLCHAIN_BIN:$PATH"
        echo "Using toolchain at: $TOOLCHAIN_BIN"

        mkdir -p build_work cd_root
        cp saturnpong.s build_work/

        # Önce Jo Engine Makefile altyapısıyla derlemeyi dene
        if [ -d "jo_engine_src/mars" ]; then
          rm -f jo_engine_src/mars/*.c jo_engine_src/mars/*.cpp jo_engine_src/mars/*.h || true
          cp saturnpong.s jo_engine_src/mars/
          cat << 'EOF' > jo_engine_src/mars/Makefile
        TARGET = saturnpong
        SRCS = saturnpong.s
        JO_ENGINE_SRC = ..
        include $(JO_ENGINE_SRC)/Makefile.cfg
        EOF
          make -C jo_engine_src/mars || true
        fi

        # Çıktıyı saf (header'sız) SH-2 binary (0.BIN) olarak çıkar
        FOUND_BIN=$(find jo_engine_src/mars -name "*.bin" ! -name "IP.BIN" | head -n 1)
        FOUND_ELF=$(find jo_engine_src/mars -name "*.elf" | head -n 1)

        if [ -n "$FOUND_BIN" ]; then
          cp "$FOUND_BIN" cd_root/0.BIN
        elif [ -n "$FOUND_ELF" ]; then
          sh-elf-objcopy -O binary "$FOUND_ELF" cd_root/0.BIN
        else
          # Saf bağımsız Assembly dosyası için doğrudan 0x06004000 adresine linkle
          sh-elf-as saturnpong.s -o build_work/saturnpong.o
          sh-elf-ld -Ttext 0x06004000 build_work/saturnpong.o -o build_work/saturnpong.elf
          sh-elf-objcopy -O binary build_work/saturnpong.elf cd_root/0.BIN
        fi

        ls -lh cd_root/0.BIN

    - name: Build Sega Saturn ISO & CUE with genisoimage
      run: |
        mkdir -p final_cd_bundle

        # Repodaki SaturnCD/IP.BIN/IP.BIN dosyasını al
        if [ -f "SaturnCD/IP.BIN/IP.BIN" ]; then
          cp "SaturnCD/IP.BIN/IP.BIN" IP.BIN
        else
          echo "HATA: SaturnCD/IP.BIN/IP.BIN bulunamadı!"
          exit 1
        fi

        # IP.BIN dosyasını -G ile ISO'nun ilk 16 sektörüne (boot alanına) yaz ve 0.BIN'i içine paketle
        genisoimage \
          -sysid "SEGA SATURN" \
          -volid "SATURNPONG" \
          -volset "SATURNPONG" \
          -publisher "KGAMER" \
          -preparer "KGAMER" \
          -appid "SATURNPONG" \
          -G IP.BIN \
          -full-iso9660-filenames \
          -o final_cd_bundle/SaturnPong.iso \
          cd_root/

        # Emülatörler ve ODE'ler için standart MODE1/2048 CUE dosyası oluştur
        cat << 'EOF' > final_cd_bundle/SaturnPong.cue
        FILE "SaturnPong.iso" BINARY
          TRACK 01 MODE1/2048
            INDEX 01 00:00:00
        EOF

        # Doğrulama: ISO başındaki SEGA imzasını ve içindeki 0.BIN dosyasını logda göster
        echo "--- Boot Sektörü Kontrolü ---"
        head -c 64 final_cd_bundle/SaturnPong.iso | strings || true
        echo "--- ISO İçeriği Kontrolü ---"
        isoinfo -l -i final_cd_bundle/SaturnPong.iso

        zip -j SaturnPong-Official-CD.zip final_cd_bundle/SaturnPong.iso final_cd_bundle/SaturnPong.cue

    - name: Upload Playable Saturn CD Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SaturnPong-Official-CD-Bundle
        path: SaturnPong-Official-CD.zip
