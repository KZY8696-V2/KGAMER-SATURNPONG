name: SaturnCD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Prerequisites & Unzip
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget unzip

    - name: Download Jo Engine v2026.3 via Direct Zip Archive
      run: |
        wget -O jo_engine.zip https://github.com/johannes-fetz/joengine/archive/refs/tags/v2026.3.zip
        unzip -q jo_engine.zip
        mv joengine-2026.3 jo_engine_src

    - name: Setup Toolchain and Integrate Assembly Source
      run: |
        cd jo_engine_src
        chmod -R +x Compiler/LINUX/ || true
        
        if [ -d "mars" ]; then
          rm -f mars/*.c mars/*.cpp mars/*.h || true
          cp ../saturnpong.s mars/
          
          if [ -f "../SaturnCD/IP.BIN/IP.BIN" ]; then
            cp ../SaturnCD/IP.BIN/IP.BIN mars/IP.BIN
            echo "IP.BIN successfully copied from SaturnCD/IP.BIN/IP.BIN"
          fi
          
          echo "TARGET = saturnpong" > mars/Makefile
          echo "SRCS = saturnpong.s" >> mars/Makefile
          echo "JO_ENGINE_SRC = .." >> mars/Makefile
          echo "all:" >> mars/Makefile
          echo "	sh-elf-gcc -c saturnpong.s -o saturnpong.o" >> mars/Makefile
          echo "	include \$(JO_ENGINE_SRC)/Makefile.cfg" >> mars/Makefile
        fi

    - name: Compile Assembly Source
      run: |
        cd jo_engine_src
        if [ -d "mars" ]; then
          cd mars
          make clean || true
          make || true
          cd ..
        fi

    - name: Capture Raw Build Artifacts
      run: |
        mkdir -p raw_output
        find jo_engine_src -name "*.bin" -exec cp {} raw_output/ \;
        find jo_engine_src -name "*.elf" -exec cp {} raw_output/ \;
        find jo_engine_src -name "*.o" -exec cp {} raw_output/ \;
        if [ -f "SaturnCD/IP.BIN/IP.BIN" ]; then
          cp SaturnCD/IP.BIN/IP.BIN raw_output/
        fi

    - name: Upload Raw Artifacts for Packager
      uses: actions/upload-artifact@v4
      with:
        name: raw-build-files
        path: raw_output/

  package-cd:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository (For IP.BIN access)
      uses: actions/checkout@v4

    - name: Install ISO Packaging Tool
      run: |
        sudo apt-get update
        sudo apt-get install -y genisoimage zip

    - name: Download Raw Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: raw-build-files
        path: downloaded_raw

    - name: Package Sega Saturn CD with genisoimage
      run: |
        mkdir -p saturn_cd_staging cd_root final_cd_bundle
        
        find downloaded_raw -maxdepth 2 -type f \( -name "*.bin" -o -name "*.elf" -o -name "*.o" -o -name "*.BIN" \) -not -name "IP.BIN" -exec cp {} saturn_cd_staging/ \;
        
        cd saturn_cd_staging
        ls -la
        
        if [ -f "saturnpong.elf" ] && [ ! -f "0.bin" ]; then
          sh-elf-objcopy -O binary saturnpong.elf 0.bin || cp saturnpong.elf 0.bin
        elif [ -f "saturnpong.o" ] && [ ! -f "0.bin" ]; then
          sh-elf-objcopy -O binary saturnpong.o 0.bin || cp saturnpong.o 0.bin
        elif [ -f "saturnpong.bin" ] && [ ! -f "0.bin" ]; then
          cp saturnpong.bin 0.bin
        fi
        
        if [ -f "0.bin" ]; then
          cp 0.bin ../cd_root/
        else
          echo "HATA: Derlenmiş 0.bin bulunamadı!"
          exit 1
        fi
        
        cd ..
        
        if [ -f "SaturnCD/IP.BIN/IP.BIN" ]; then
          cp "SaturnCD/IP.BIN/IP.BIN" IP.BIN
        elif [ -f "downloaded_raw/IP.BIN" ]; then
          cp downloaded_raw/IP.BIN IP.BIN
        else
          echo "HATA: IP.BIN bulunamadı!"
          exit 1
        fi
        
        genisoimage \
          -sysid "SEGA SATURN" \
          -volid "SATURNPONG" \
          -volset "SATURNPONG" \
          -publisher "KGAMER" \
          -preparer "KGAMER" \
          -appid "SATURNPONG" \
          -G IP.BIN \
          -full-iso9660-filenames \
          -o final_cd_bundle/SaturnPong.iso \
          cd_root/
          
        cat << 'EOF' > final_cd_bundle/SaturnPong.cue
        FILE "SaturnPong.iso" BINARY
          TRACK 01 MODE1/2048
            INDEX 01 00:00:00
        EOF
        
        ls -la final_cd_bundle/
        zip -j SaturnPong-Official-CD.zip final_cd_bundle/SaturnPong.iso final_cd_bundle/SaturnPong.cue

    - name: Upload Playable Saturn CD Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SaturnPong-Official-CD-Bundle
        path: SaturnPong-Official-CD.zip
