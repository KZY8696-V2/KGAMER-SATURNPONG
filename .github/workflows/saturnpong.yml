name: Build SaturnPong (Jo Engine Native Pipeline)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Prerequisites & Unzip
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget unzip zip

    - name: Download Jo Engine v2026.3 via Direct Zip Archive
      run: |
        wget -O jo_engine.zip https://github.com/johannes-fetz/joengine/archive/refs/tags/v2026.3.zip
        unzip -q jo_engine.zip
        mv joengine-2026.3 jo_engine_src

    - name: Setup Jo Engine Permissions & Tools
      run: |
        cd jo_engine_src
        chmod -R +x Compiler/LINUX/ || true
        if [ -f "jo_make" ]; then
          chmod +x jo_make
        fi

    - name: Integrate SaturnPong Source and Generate Makefile
      run: |
        cd jo_engine_src
        
        # Proje dizinini oluşturuyoruz
        mkdir -p saturnpong
        cp ../saturnpong.s saturnpong/
        
        if [ -f "../IP.BIN" ]; then
          cp ../IP.BIN saturnpong/
        fi
        
        # Jo Engine uyumlu Makefile dosyasını doğrudan buraya yazıyoruz
        cat << 'EOF' > saturnpong/Makefile
        TARGET = saturnpong
        SRCS = saturnpong.s
        JO_ENGINE_SRC = ..
        include $(JO_ENGINE_SRC)/Makefile.cfg
        EOF

    - name: Compile and Run Jo Engine Native Cue Maker
      run: |
        cd jo_engine_src
        
        # Proje dizinine girip derlemeyi çalıştırıyoruz
        cd saturnpong
        make || true
        cd ..
        
        # Jo Engine'in kendi dahili Cue Maker aracını çalıştırıyoruz
        if [ -f "Compiler/LINUX/Other Utilities/JoEngineCueMaker" ]; then
          cd saturnpong
          ../Compiler/LINUX/Other\ Utilities/JoEngineCueMaker || true
          cd ..
        fi

    - name: Capture Native Jo Engine Outputs
      run: |
        mkdir -p final_output
        
        # Üretilen ISO, CUE ve BIN dosyalarını topluyoruz
        find jo_engine_src -type f \( -name "*.iso" -o -name "*.cue" -o -name "*.bin" \) -exec cp {} final_output/ \;
        
        ls -la final_output/
        zip -r SaturnPong-JoEngine-Native.zip final_output/

    - name: Upload Native Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SaturnPong-Native-Bundle
        path: SaturnPong-JoEngine-Native.zip
