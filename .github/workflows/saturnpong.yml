name: Build SaturnPong (Jo Engine Native Tools Pipeline)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Prerequisites & Unzip
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget unzip zip

    - name: Download Jo Engine v2026.3 via Direct Zip Archive
      run: |
        wget -O jo_engine.zip https://github.com/johannes-fetz/joengine/archive/refs/tags/v2026.3.zip
        unzip -q jo_engine.zip
        mv joengine-2026.3 jo_engine_src

    - name: Integrate SaturnPong Source into Jo Engine
      run: |
        mkdir -p jo_engine_src/saturnpong
        cp saturnpong.s jo_engine_src/saturnpong/
        
        if [ -f "IP.BIN" ]; then
          cp IP.BIN jo_engine_src/
        fi

    - name: Run Jo Engine Build & Native Utilities (`JoEngineCueMaker`)
      run: |
        cd jo_engine_src
        
        # Linux derleme araçlarına çalıştırma izni verelim
        chmod -R +x Compiler/LINUX/ || true
        
        # Jo Engine'in kendi ana derleme akışını çalıştırıyoruz
        if [ -f "jo_make" ]; then
          chmod +x jo_make
          ./jo_make
        else
          make || true
        fi
        
        # Eğer Jo Engine'in kendi JoEngineCueMaker aracı varsa doğrudan çalıştırarak CUE dosyasını ürettirelim
        if [ -f "Compiler/LINUX/Other Utilities/JoEngineCueMaker" ]; then
          chmod +x "Compiler/LINUX/Other Utilities/JoEngineCueMaker"
          "Compiler/LINUX/Other Utilities/JoEngineCueMaker" || true
        fi

    - name: Capture Native Jo Engine Outputs
      run: |
        mkdir -p final_output
        
        # Jo Engine'in ve JoEngineCueMaker'ın ürettiği orijinal iso, cue ve bin dosyalarını topluyoruz
        find jo_engine_src -type f \( -name "*.iso" -o -name "*.cue" -o -name "*.bin" \) -exec cp {} final_output/ \;
        
        ls -la final_output/
        zip -r SaturnPong-JoEngine-Native.zip final_output/

    - name: Upload Native Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SaturnPong-Native-Bundle
        path: SaturnPong-JoEngine-Native.zip
