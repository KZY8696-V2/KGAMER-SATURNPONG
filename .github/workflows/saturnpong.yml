name: Build SaturnPong (Jo Engine Native Pipeline)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Prerequisites & Unzip
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget unzip zip

    - name: Download Jo Engine v2026.3 via Direct Zip Archive
      run: |
        wget -O jo_engine.zip https://github.com/johannes-fetz/joengine/archive/refs/tags/v2026.3.zip
        unzip -q jo_engine.zip
        mv joengine-2026.3 jo_engine_src

    - name: Setup Toolchain Permissions & Integrate Assembly Source
      run: |
        cd jo_engine_src
        chmod -R +x Compiler/LINUX/ || true
        
        # Mars örnek projesinin içindeki C dosyalarını temizleyip saturnpong.s dosyamızı koyuyoruz
        if [ -d "mars" ]; then
          rm -f mars/*.c mars/*.cpp mars/*.h || true
          cp ../saturnpong.s mars/
          
          if [ -f "../IP.BIN" ]; then
            cp ../IP.BIN mars/
          fi
          
          # Makefile içeriğini doğrudan güvenli bir şekilde yazıyoruz
          echo "TARGET = saturnpong" > mars/Makefile
          echo "SRCS = saturnpong.s" >> mars/Makefile
          echo "JO_ENGINE_SRC = .." >> mars/Makefile
          echo "include \$(JO_ENGINE_SRC)/Makefile.cfg" >> mars/Makefile
        fi

    - name: Compile and Run Jo Engine Native Cue Maker
      run: |
        cd jo_engine_src
        if [ -d "mars" ]; then
          cd mars
          make clean || true
          make
          
          # Jo Engine'in dahili Cue Maker aracını çalıştırarak ISO ve CUE imajını üretiyoruz
          ../../Compiler/LINUX/Other\ Utilities/JoEngineCueMaker || true
          cd ..
        fi

    - name: Capture and Package Native Outputs
      run: |
        mkdir -p final_output
        find jo_engine_src -type f \( -name "*.iso" -o -name "*.cue" -o -name "*.bin" \) -exec cp {} final_output/ \;
        ls -la final_output/
        zip -r SaturnPong-JoEngine-Native.zip final_output/

    - name: Upload Native Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SaturnPong-Native-Bundle
        path: SaturnPong-JoEngine-Native.zip
