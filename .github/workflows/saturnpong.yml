name: Build SaturnPong (Jo Engine Native Pipeline)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Prerequisites & Unzip
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget unzip zip

    - name: Download Jo Engine v2026.3 via Direct Zip Archive
      run: |
        wget -O jo_engine.zip https://github.com/johannes-fetz/joengine/archive/refs/tags/v2026.3.zip
        unzip -q jo_engine.zip
        mv joengine-2026.3 jo_engine_src

    - name: Setup Permissions for Native Tools
      run: |
        cd jo_engine_src
        # Jo Engine'in kendi derleme ve yardımcı araçlarına tam yetki verelim
        chmod -R +x Compiler/LINUX/ || true
        
    - name: Integrate SaturnPong Source into Jo Engine Sample Structure
      run: |
        cd jo_engine_src
        if [ -d "mars" ]; then
          rm -f mars/*.c mars/*.cpp mars/*.h || true
          cp ../saturnpong.s mars/
          if [ -f "../IP.BIN" ]; then
            cp ../IP.BIN mars/
          fi
          printf "TARGET = saturnpong\nSRCS = saturnpong.s\nJO_ENGINE_SRC = ..\ninclude \$(JO_ENGINE_SRC)/Makefile.cfg\n" > mars/Makefile
        fi
          
          # Mars projesinin Makefile dosyasını saf Assembly (.s) derleyecek şekilde güncelliyoruz
          cat << 'EOF' > mars/Makefile
          TARGET = saturnpong
          SRCS = saturnpong.s
          JO_ENGINE_SRC = ..
          include $(JO_ENGINE_SRC)/Makefile.cfg
          EOF
        fi
        
    - name: Compile and Run Native Cue Maker
      run: |
        cd jo_engine_src
        
        # Doğrudan mars (artık saturnpong oldu) klasörüne girip derlemeyi tetikliyoruz
        if [ -d "mars" ]; then
          cd mars
          make clean || true
          make
          
          # Jo Engine'in dahili Cue Maker aracını doğrudan imajın üretildiği bu klasörde çalıştırıyoruz
          # JoEngineCueMaker derlenen dosyaları tarayarak CUE ve ISO imajını oluşturur
          ../../Compiler/LINUX/Other\ Utilities/JoEngineCueMaker || true
          cd ..
        fi

    - name: Capture Native Jo Engine Outputs
      run: |
        mkdir -p final_output
        
        # Üretilen ISO, CUE ve BIN dosyalarını toplayalım
        find jo_engine_src -type f \( -name "*.iso" -o -name "*.cue" -o -name "*.bin" \) -exec cp {} final_output/ \;
        
        ls -la final_output/
        zip -r SaturnPong-JoEngine-Native.zip final_output/

    - name: Upload Native Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SaturnPong-Native-Bundle
        path: SaturnPong-JoEngine-Native.zip
