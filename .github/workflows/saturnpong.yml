name: Build SaturnPong (Jo Engine Native ISO Pipeline)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Prerequisites & Unzip
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget unzip zip

    - name: Download Jo Engine v2026.3 via Direct Zip Archive
      run: |
        wget -O jo_engine.zip https://github.com/johannes-fetz/joengine/archive/refs/tags/v2026.3.zip
        unzip -q jo_engine.zip
        mv joengine-2026.3 jo_engine_src

    - name: Integrate SaturnPong Source into Jo Engine
      run: |
        mkdir -p jo_engine_src/saturnpong
        cp saturnpong.s jo_engine_src/saturnpong/
        
        if [ -f "IP.BIN" ]; then
          cp IP.BIN jo_engine_src/
        fi

    - name: Compile and Generate ISO Using Jo Engine Internal System
      run: |
        cd jo_engine_src
        
        # Jo Engine'in kendi dahili make/build ve ISO oluşturma betiklerini çalıştırıyoruz
        if [ -f "jo_make" ]; then
          chmod +x jo_make
          ./jo_make
        elif [ -f "Makefile.cfg" ]; then
          make -f Makefile.cfg
        else
          make
        fi

    - name: Capture Jo Engine's Native ISO and CUE Outputs
      run: |
        mkdir -p final_output
        
        # Jo Engine'in kök dizininde veya alt klasörlerinde ürettiği orijinal ISO/CUE/BIN dosyalarını arayıp topluyoruz
        find . -type f \( -name "*.iso" -o -name "*.cue" -o -name "*.bin" \) -exec cp {} final_output/ \;
        
        # İçeriği kontrol etmek için listeleyelim
        ls -la final_output/
        
        # Kullanıcının indirmesi için zip paketi haline getirelim
        zip -r SaturnPong-JoEngine-Native-ISO.zip final_output/

    - name: Upload Native ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SaturnPong-Native-ISO-Bundle
        path: SaturnPong-JoEngine-Native-ISO.zip
