name: Build SaturnPong (Jo Engine Native Pipeline)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Prerequisites & Unzip
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget unzip zip

    - name: Download Jo Engine v2026.3 via Direct Zip Archive
      run: |
        wget -O jo_engine.zip https://github.com/johannes-fetz/joengine/archive/refs/tags/v2026.3.zip
        unzip -q jo_engine.zip
        mv joengine-2026.3 jo_engine_src

    - name: Setup Permissions for Native Tools
      run: |
        cd jo_engine_src
        # Jo Engine'in kendi derleme ve yardımcı araçlarına tam yetki verelim
        chmod -R +x Compiler/LINUX/ || true

    - name: Integrate SaturnPong Source into Jo Engine
      run: |
        cd jo_engine_src
        
        # Kodumuzu uygun bir klasöre yerleştiriyoruz
        mkdir -p saturnpong
        cp ../saturnpong.s saturnpong/
        
        if [ -f "../IP.BIN" ]; then
          cp ../IP.BIN saturnpong/
        fi

    - name: Compile and Run Native Cue Maker
      run: |
        cd jo_engine_src
        
        # Eğer jo_make varsa onu çalıştıralım, yoksa mars örneği üzerinden derleme tetikleyelim
        if [ -f "jo_make" ]; then
          chmod +x jo_make
          ./jo_make || true
        elif [ -d "mars" ]; then
          # Mars projesinin Makefile yapsını kopyalayarak hızlı bir derleme yolu açalım
          cp mars/Makefile saturnpong/
          cd saturnpong
          make || true
          cd ..
        fi
        
        # Doğrudan kök dizinden absolute (tam) yolla JoEngineCueMaker aracını çalıştıralım
        # Böylece dizin kayması (No such file or directory) hatası asla yaşanmaz
        CUE_MAKER="./Compiler/LINUX/Other Utilities/JoEngineCueMaker"
        if [ -f "$CUE_MAKER" ]; then
          chmod +x "$CUE_MAKER"
          "$CUE_MAKER" || true
        else
          # Boşluklu dizin ihtimaline karşı alternatif yol
          ALT_MAKER="./Compiler/LINUX/Other Utilities/JoEngineCueMaker"
          find "Compiler/LINUX" -name "JoEngineCueMaker" -exec chmod +x {} \; -exec {} \; || true
        fi

    - name: Capture Native Jo Engine Outputs
      run: |
        mkdir -p final_output
        
        # Üretilen ISO, CUE ve BIN dosyalarını toplayalım
        find jo_engine_src -type f \( -name "*.iso" -o -name "*.cue" -o -name "*.bin" \) -exec cp {} final_output/ \;
        
        ls -la final_output/
        zip -r SaturnPong-JoEngine-Native.zip final_output/

    - name: Upload Native Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SaturnPong-Native-Bundle
        path: SaturnPong-JoEngine-Native.zip
