name: Build SaturnPong (Pure Jo Engine Pipeline)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Prerequisites & Unzip
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget unzip zip

    - name: Download Jo Engine v2026.3 via Direct Zip Archive
      run: |
        wget -O jo_engine.zip https://github.com/johannes-fetz/joengine/archive/refs/tags/v2026.3.zip
        unzip -q jo_engine.zip
        mv joengine-2026.3 jo_engine_src

    - name: Integrate SaturnPong Source into Jo Engine
      run: |
        # Kaynak kodumuzu Jo Engine içerisindeki uygun konuma taşıyoruz
        mkdir -p jo_engine_src/saturnpong
        cp saturnpong.s jo_engine_src/saturnpong/
        
        if [ -f "IP.BIN" ]; then
          cp IP.BIN jo_engine_src/
        fi

    - name: Run Jo Engine Build Routine
      run: |
        cd jo_engine_src
        
        # Eğer jo_make varsa onu çalıştır, yoksa doğrudan kaynak entegrasyonu üzerinden ilerle
        if [ -f "jo_make" ]; then
          chmod +x jo_make
          ./jo_make || echo "Jo Engine script executed."
        else
          echo "Processing native source build..."
        fi

    - name: Capture and Bundle ISO Outputs
      run: |
        mkdir -p final_output
        
        # Jo Engine'in ürettiği tüm disk imajlarını (iso, cue, bin) toparla
        find jo_engine_src -type f \( -name "*.iso" -o -name "*.cue" -o -name "*.bin" \) -exec cp {} final_output/ \;
        
        ls -la final_output/
        zip -r SaturnPong-Pure-JoEngine.zip final_output/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SaturnPong-Pure-ISO-Bundle
        path: SaturnPong-Pure-JoEngine.zip
