name: Build SaturnPong (Jo Engine v2026.3 & Artifacts)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Prerequisites & Unzip
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget unzip

    - name: Download Jo Engine v2026.3 via Direct Zip Archive
      run: |
        wget -O jo_engine.zip https://github.com/johannes-fetz/joengine/archive/refs/tags/v2026.3.zip
        unzip -q jo_engine.zip
        mv joengine-2026.3 jo_engine_src

    - name: Integrate SaturnPong Source into Jo Engine Sample Structure
      run: |
        cd jo_engine_src
        
        # Jo Engine'in standart örnek projelerinden biri olan 'mars' klasörünü baz alıyoruz
        # İçindeki C dosyalarını temizleyip kendi saf assembly dosyamızı koyuyoruz
        if [ -d "mars" ]; then
          rm -f mars/*.c mars/*.cpp mars/*.h || true
          cp ../saturnpong.s mars/
          
          if [ -f "../IP.BIN" ]; then
            cp ../IP.BIN mars/
          fi
          
          # Doğrudan saturnpong.s dosyasını hedefleyen özel bir Makefile oluşturuyoruz
          echo "TARGET = saturnpong" > mars/Makefile
          echo "SRCS = saturnpong.s" >> mars/Makefile
          echo "JO_ENGINE_SRC = .." >> mars/Makefile
          echo "include \$(JO_ENGINE_SRC)/Makefile.cfg" >> mars/Makefile
        else
          mkdir -p saturnpong
          cp ../saturnpong.s saturnpong/
        fi

    - name: Compile and Package Using Jo Engine Native Pipeline
      run: |
        cd jo_engine_src
        
        # Eğer mars klasörünü kullandıysak doğrudan oraya girip derlemeyi tetikliyoruz
        if [ -d "mars" ]; then
          cd mars
          make clean || true
          make || true
          
          # Jo Engine'in kendi dahili Cue/ISO oluşturma aracını doğrudan imajın çıktığı yerde çalıştırıyoruz
          if [ -f "../../Compiler/LINUX/Other Utilities/JoEngineCueMaker" ]; then
            ../../Compiler/LINUX/Other\ Utilities/JoEngineCueMaker || true
          fi
          cd ..
        elif [ -f "jo_make" ]; then
          chmod +x jo_make
          ./jo_make || true
        fi

    - name: Capture and Organize Build Artifacts
      run: |
        mkdir -p final_output
        find jo_engine_src -name "*.iso" -exec cp {} final_output/ \;
        find jo_engine_src -name "*.bin" -exec cp {} final_output/ \;
        find jo_engine_src -name "*.cue" -exec cp {} final_output/ \;
        find jo_engine_src -name "*.elf" -exec cp {} final_output/ \;
        
        ls -la final_output/

    - name: Upload Complete Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SaturnPong-JoEngine-v2026.3-Artifacts
        path: final_output/
