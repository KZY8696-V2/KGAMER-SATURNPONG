name: Build SaturnPong (Jo Engine Native Pipeline)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Prerequisites & Unzip
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget unzip zip

    - name: Download Jo Engine v2026.3 via Direct Zip Archive
      run: |
        wget -O jo_engine.zip https://github.com/johannes-fetz/joengine/archive/refs/tags/v2026.3.zip
        unzip -q jo_engine.zip
        mv joengine-2026.3 jo_engine_src

    - name: Integrate SaturnPong Source into Jo Engine Sample Structure
      run: |
        # Jo Engine projeleri genellikle 'jo_engine_src/mars' veya örnek bir klasör yapısında derlenir.
        # Kaynak dosyamızı Jo Engine'in örnek projelerinden birinin içine veya kendi klasörüne kopyalıyoruz.
        mkdir -p jo_engine_src/saturnpong
        cp saturnpong.s jo_engine_src/saturnpong/
        
        if [ -f "IP.BIN" ]; then
          cp IP.BIN jo_engine_src/saturnpong/
        fi
        
        # Jo Engine'in örnek bir makefile yapısını projemize kopyalayarak derlenebilir hale getiriyoruz
        if [ -f "jo_engine_src/mars/Makefile" ]; then
          cp jo_engine_src/mars/Makefile jo_engine_src/saturnpong/
        elif [ -f "jo_engine_src/Makefile.cfg" ]; then
          cp jo_engine_src/Makefile.cfg jo_engine_src/saturnpong/
        fi

    - name: Compile and Run Jo Engine Native Cue Maker
      run: |
        # Doğrudan projenin kendi klasörüne girip derlemeyi başlatıyoruz
        cd jo_engine_src/saturnpong
        
        # Derleme işlemi
        make || true
        
        # Üst dizindeki Jo Engine ana derleme araçlarına izin verelim
        cd ../..
        chmod -R +x Compiler/LINUX/ || true
        
        # Jo Engine'in kendi dahili Cue Maker aracını doğru yoldan çağırıyoruz
        if [ -f "jo_engine_src/Compiler/LINUX/Other Utilities/JoEngineCueMaker" ]; then
          cd jo_engine_src/saturnpong
          ../Compiler/LINUX/Other\ Utilities/JoEngineCueMaker || true
          cd ../..
        fi

    - name: Capture Native Jo Engine Outputs
      run: |
        mkdir -p final_output
        
        # Jo Engine'in kendi dizininde ürettiği iso, cue ve bin dosyalarını topluyoruz
        find jo_engine_src -type f \( -name "*.iso" -o -name "*.cue" -o -name "*.bin" \) -exec cp {} final_output/ \;
        
        ls -la final_output/
        zip -r SaturnPong-JoEngine-Native.zip final_output/

    - name: Upload Native Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SaturnPong-Native-Bundle
        path: SaturnPong-JoEngine-Native.zip
