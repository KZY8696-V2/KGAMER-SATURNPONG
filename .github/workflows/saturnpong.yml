name: Build SaturnPong (Jo Engine Native Pipeline)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Prerequisites & Unzip
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget unzip zip

    - name: Download Jo Engine v2026.3 via Direct Zip Archive
      run: |
        wget -O jo_engine.zip https://github.com/johannes-fetz/joengine/archive/refs/tags/v2026.3.zip
        unzip -q jo_engine.zip
        mv joengine-2026.3 jo_engine_src

    - name: Setup Jo Engine Permissions & Toolchain
      run: |
        cd jo_engine_src
        chmod -R +x Compiler/LINUX/ || true
        if [ -f "jo_make" ]; then
          chmod +x jo_make
        fi

    - name: Integrate SaturnPong Source into Jo Engine Sample Structure
      run: |
        cd jo_engine_src
        
        # Jo Engine'in mevcut çalışan örnek projelerinden birini (örneğin 'mars') şablon alıyoruz
        # Kendi assembly kodumuzu buraya entegre edeceğiz
        if [ -d "mars" ]; then
          cp ../saturnpong.s mars/
          if [ -f "../IP.BIN" ]; then
            cp ../IP.BIN mars/
          fi
          # Mars projesinin ana C dosyasını pasife alıp kendi kodumuzu dahil ediyoruz veya doğrudan kullanıyoruz
          echo "Source integrated into mars sample directory."
        else
          mkdir -p saturnpong
          cp ../saturnpong.s saturnpong/
        fi

    - name: Compile and Run Jo Engine Native Cue Maker
      run: |
        cd jo_engine_src
        
        # Eğer jo_make betiği varsa onu çalıştırıyoruz (Jo Engine'in ana derleyicisi)
        if [ -f "./jo_make" ]; then
          ./jo_make || true
        elif [ -d "mars" ]; then
          cd mars
          make || true
          cd ..
        fi
        
        # Jo Engine'in kendi dahili Cue Maker aracını çalıştırıyoruz
        if [ -f "Compiler/LIN/Other Utilities/JoEngineCueMaker" ]; then
          "Compiler/LINUX/Other Utilities/JoEngineCueMaker" || true
        elif [ -f "Compiler/LINUX/Other Utilities/JoEngineCueMaker" ]; then
          cd mars 2>/dev/null || cd saturnpong 2>/dev/null || true
          ../../Compiler/LINUX/Other\ Utilities/JoEngineCueMaker || true
        fi

    - name: Capture Native Jo Engine Outputs
      run: |
        mkdir -p final_output
        
        # Üretilen ISO, CUE ve BIN dosyalarını topluyoruz
        find jo_engine_src -type f \( -name "*.iso" -o -name "*.cue" -o -name "*.bin" \) -exec cp {} final_output/ \;
        
        ls -la final_output/
        zip -r SaturnPong-JoEngine-Native.zip final_output/

    - name: Upload Native Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SaturnPong-Native-Bundle
        path: SaturnPong-JoEngine-Native.zip
