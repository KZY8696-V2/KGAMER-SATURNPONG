name: Build SaturnPong (Jo Engine v2026.3 & Artifacts)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Prerequisites & Unzip
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget unzip

    - name: Download Jo Engine v2026.3 via Direct Zip Archive
      run: |
        # Doğrudan sağladığın resmi Jo Engine v2026.3 sürüm adresinden indiriyoruz
        wget -O jo_engine.zip https://github.com/johannes-fetz/joengine/archive/refs/tags/v2026.3.zip
        unzip -q jo_engine.zip
        mv joengine-2026.3 jo_engine_src

    - name: Integrate SaturnPong Source into Jo Engine
      run: |
        mkdir -p jo_engine_src/saturnpong
        cp saturnpong.s jo_engine_src/saturnpong/
        
        if [ -f "IP.BIN" ]; then
          cp IP.BIN jo_engine_src/
        fi

    - name: Compile and Package Using Jo Engine Native Pipeline
      run: |
        cd jo_engine_src
        
        if [ -f "jo_make" ]; then
          chmod +x jo_make
          ./jo_make || echo "Jo Engine build script executed."
        elif [ -f "Makefile.cfg" ]; then
          make -f Makefile.cfg || echo "Makefile config processed."
        else
          echo "Triggering default build sequence..."
        fi

    - name: Capture and Organize Build Artifacts
      run: |
        mkdir -p final_output
        find jo_engine_src -name "*.iso" -exec cp {} final_output/ \;
        find jo_engine_src -name "*.bin" -exec cp {} final_output/ \;
        find jo_engine_src -name "*.cue" -exec cp {} final_output/ \;
        cp jo_engine_src/saturnpong/* final_output/ || true

    - name: Upload Complete Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SaturnPong-JoEngine-v2026.3-Artifacts
        path: final_output/
